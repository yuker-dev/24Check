<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24Check</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg" href="Images/24Check-logo-nobg.svg" />
  </head>
  <body>
    <header>
      <div class="intro">
        <h1 class="title">
          24Check
          <img
            src="Images/24Check-logo-nobg.svg"
            alt="24Check logo"
            height="75px"
          />
        </h1>
        <p class="text">A simple & easy checklist for ATC24 players</p>
      </div>
    </header>
    <main>
      <form>
        <div class="checklists"></div>
        <div class="resetbtn">
          <button type="reset" class="resetButton">Reset checklist</button>
        </div>
      </form>
    </main>
    <footer>
      <p class="text">Copyright 2026 Anchor Studio</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
