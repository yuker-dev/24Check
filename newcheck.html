<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>24Check V2</title>
        <link rel="stylesheet" href="css/newCheckStyle.css">
	</head>
	<body>
		<header>
			<div class="intro">
				<h1 class="title">
					24Check
					<img
						src="Images/24Check-logo-nobg.svg"
						alt="24Check logo"
						height="75px"
					/>
				</h1>
				<p class="text">A simple & easy checklist for ATC24 players</p>
			</div>
		</header>
        <main>
            <div class="checklist">
                <div class="title">
                    <h2 class="checklistName">Checklist name</h2>
                </div>
                <div class="checkbox">                
                    <ul>
                        <li>Check 1</li>
                        <li>Check 2</li>
                    </ul>
                </div>
                <div class="buttons">
                    <div class="leftSide side">
                        <button>Return</button>
                    </div>
                    <div class="rightSide side">
                        <button>Next</button>
                        <a href="">Skip</a>
                    </div>
                </div>
            </div>
        </main>
	</body>
</html>
